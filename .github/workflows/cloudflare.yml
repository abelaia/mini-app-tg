name: Cloudflare

on:
    push:
        branches:
            - develop
    pull_request:
        branches:
            - main
            - develop
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: cloudflare-${{ github.event_name == 'workflow_dispatch' && 'production' || github.ref }}
    cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
    publish:
        # Production requires an explicit run by the repository owner from main.
        if: github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner)
        runs-on: ubuntu-latest
        env:
            CF_SEND_TELEMETRY: 'false'
            DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'preview' }}
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: |
                      frontend/package-lock.json
                      cloudflare/package-lock.json

            - name: Install frontend dependencies
              run: npm ci
              working-directory: frontend

            - name: Install Worker dependencies
              run: npm ci
              working-directory: cloudflare

            - name: Check formatting
              run: npm run format:check
              working-directory: frontend

            - name: Test API and reminders
              run: npm test
              working-directory: cloudflare

            - name: Build selected environment
              run: npx cf build --mode "$DEPLOY_MODE"
              working-directory: cloudflare

            - name: Validate deployment
              run: npx cf deploy --prebuilt --mode "$DEPLOY_MODE" --dry-run
              working-directory: cloudflare

            - name: Publish selected environment
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              run: npx cf deploy --prebuilt --mode "$DEPLOY_MODE" --force
              working-directory: cloudflare
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: '98e33c9871ec96f44663107d50d8abf3'
